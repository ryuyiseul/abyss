<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABYSS 2차 지사 면접 일정 조회</title>
<meta name="description" content="성함 혹은 활동명을 입력하면 배정된 2차 지사 면접 일정과 진행 안내를 확인하실 수 있습니다.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta property="og:title" content="ABYSS 2차 지사 면접 일정 조회">
<meta property="og:description" content="성함 혹은 활동명을 입력하시면 배정된 면접 일시와 장소를 확인하실 수 있습니다.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --black:#000000;
    --panel:#0B0B0C;
    --panel-2:#121214;
    --hair:#2A2A2E;
    --hair-soft:#1A1A1D;
    --white:#FFFFFF;
    --silver:#C6C8CC;
    --silver-2:#8E9095;
    --silver-3:#66686D;
    --maxw:560px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--black);
    color:var(--white);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:16px;line-height:1.65;letter-spacing:-0.01em;
    word-break:keep-all;overflow-wrap:break-word;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;padding:0 20px 72px;
  }
  .wrap{max-width:var(--maxw);margin:0 auto}
  ::selection{background:var(--white);color:var(--black)}

  /* ---------- header ---------- */
  header{padding:60px 0 34px}
  .mark{display:block;height:26px;width:auto;opacity:.96}
  .rule{height:1px;background:linear-gradient(90deg,var(--hair),transparent);margin:22px 0 20px}
  .kicker{
    font-size:.78rem;color:var(--silver-3);
    letter-spacing:.24em;margin:0 0 12px;
  }
  h1{
    margin:0 0 12px;
    font-size:clamp(1.65rem,5.8vw,2.1rem);
    font-weight:300;line-height:1.3;letter-spacing:-0.03em;
  }
  header .lede{margin:0;color:var(--silver-2);font-size:.94rem;max-width:44ch}

  /* ---------- search ---------- */
  .search{display:flex;gap:8px;margin-top:28px}
  .field{position:relative;flex:1}
  input[type=text]{
    width:100%;padding:15px 16px;
    background:var(--panel);
    border:1px solid var(--hair);
    border-radius:2px;
    color:var(--white);font:inherit;font-size:1rem;
    transition:border-color .15s ease,background .15s ease;
  }
  input[type=text]::placeholder{color:var(--silver-3)}
  input[type=text]:focus{outline:none;border-color:var(--silver);background:var(--panel-2)}
  input[type=text]:focus-visible{box-shadow:0 0 0 3px rgba(198,200,204,.18)}
  button{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:2px}
  .go{
    padding:0 24px;background:var(--white);color:var(--black);
    font-weight:600;letter-spacing:-0.01em;white-space:nowrap;
    transition:background .15s ease;
  }
  .go:hover{background:var(--silver)}
  .go:focus-visible{outline:2px solid var(--white);outline-offset:3px}
  .hint{margin:12px 2px 0;font-size:.84rem;color:var(--silver-3)}

  /* ---------- result ---------- */
  #result:empty{display:none}
  .card{
    margin-top:32px;background:var(--panel);
    border:1px solid var(--hair-soft);border-radius:3px;overflow:hidden;
  }
  .reveal{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.reveal{animation:none}}

  .card-top{padding:26px 24px 28px;border-bottom:1px solid var(--hair-soft)}
  .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .who strong{font-size:1.15rem;font-weight:600;letter-spacing:-0.02em}
  .alias{
    font-size:.8rem;color:var(--silver);
    border:1px solid var(--hair);padding:2px 10px;border-radius:999px;
  }
  .when{margin-top:20px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .date{
    font-size:clamp(1.8rem,7.2vw,2.35rem);
    font-weight:300;line-height:1.08;letter-spacing:-0.035em;
    font-variant-numeric:tabular-nums;
  }
  .time{
    font-size:1.3rem;font-weight:400;letter-spacing:-0.02em;padding-bottom:3px;
    background:linear-gradient(180deg,#FFFFFF 0%,#9A9CA1 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .dday{
    display:inline-block;margin-top:14px;font-size:.8rem;color:var(--silver-2);
    border:1px solid var(--hair);border-radius:999px;padding:3px 12px;
  }
  .dday.past{color:var(--silver-3)}

  .card-body{padding:24px}
  .row{display:flex;gap:14px;padding-bottom:20px}
  .row:last-of-type{padding-bottom:0}
  .row .k{flex:0 0 66px;font-size:.85rem;color:var(--silver-3);padding-top:2px}
  .row .v{flex:1;font-size:.95rem}
  .row .v .sub{color:var(--silver-2);font-size:.88rem;margin-top:2px}
  .acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  .ghost{
    padding:9px 15px;background:transparent;border:1px solid var(--hair);
    color:var(--silver);font-size:.86rem;text-decoration:none;display:inline-block;
    transition:border-color .15s ease,color .15s ease;
  }
  .ghost:hover{border-color:var(--silver-2);color:var(--white)}
  .ghost:focus-visible{outline:2px solid var(--silver);outline-offset:2px}

  .sec{padding:24px;border-top:1px solid var(--hair-soft)}
  h2{font-size:.95rem;font-weight:600;margin:0 0 4px;letter-spacing:-0.02em}
  .steps{margin:18px 0 0;padding:0;list-style:none;position:relative}
  .steps:before{content:"";position:absolute;left:5px;top:9px;bottom:9px;width:1px;background:var(--hair)}
  .steps li{position:relative;padding:0 0 16px 24px;font-size:.94rem;color:var(--silver)}
  .steps li:last-child{padding-bottom:0}
  .steps li:before{
    content:"";position:absolute;left:0;top:8px;width:11px;height:11px;border-radius:50%;
    background:var(--black);border:1px solid var(--silver-2);
  }
  .notes{margin:22px 0 0;padding:17px 18px;background:var(--panel-2);border-radius:3px}
  .notes p{margin:0 0 10px;font-size:.89rem;color:var(--silver-2);line-height:1.65}
  .notes p:last-child{margin-bottom:0}
  .notes a{color:var(--white);text-decoration:underline;text-underline-offset:3px}

  /* ---------- empty / multi ---------- */
  .miss{
    margin-top:32px;padding:26px 24px;background:var(--panel);
    border:1px solid var(--hair-soft);border-radius:3px;
  }
  .miss h2{font-size:1.02rem;margin-bottom:8px}
  .miss p{margin:0 0 16px;color:var(--silver-2);font-size:.93rem}
  .pick{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .pick button{
    text-align:left;padding:14px 16px;background:var(--panel-2);
    border:1px solid var(--hair);color:var(--white);font-size:.95rem;
    transition:border-color .15s ease;
  }
  .pick button:hover{border-color:var(--silver-2)}
  .pick button:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
  .pick button span{color:var(--silver-3);font-size:.86rem;margin-left:6px}

  /* ---------- bottom contact ---------- */
  .contact{
    max-width:var(--maxw);margin:52px auto 0;
    padding-top:34px;border-top:1px solid var(--hair-soft);text-align:center;
  }
  .contact h2{font-size:1.05rem;margin-bottom:8px}
  .contact p{margin:0 0 22px;color:var(--silver-2);font-size:.93rem}
  .kakao-lg{
    display:flex;align-items:center;justify-content:center;gap:11px;
    width:100%;padding:21px 24px;border-radius:3px;
    background:var(--white);color:var(--black);
    font-size:1.05rem;font-weight:700;letter-spacing:-0.02em;text-decoration:none;
    transition:background .15s ease,transform .15s ease;
  }
  .kakao-lg:hover{background:var(--silver);transform:translateY(-1px)}
  .kakao-lg:active{transform:translateY(0)}
  .kakao-lg:focus-visible{outline:2px solid var(--white);outline-offset:4px}
  .kakao-lg .arw{font-weight:400;transition:transform .15s ease}
  .kakao-lg:hover .arw{transform:translateX(4px)}
  @media (prefers-reduced-motion:reduce){
    .kakao-lg,.kakao-lg .arw{transition:none}
    .kakao-lg:hover,.kakao-lg:hover .arw{transform:none}
  }
  .contact small{display:block;margin-top:15px;color:var(--silver-3);font-size:.82rem;line-height:1.6}

  footer{
    max-width:var(--maxw);margin:36px auto 0;text-align:center;
    color:var(--silver-3);font-size:.75rem;letter-spacing:.2em;
  }
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
    background:var(--white);color:var(--black);font-weight:600;font-size:.87rem;
    padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;

function dday(iso,h){
  const now = new Date();
  const target = new Date(iso + "T00:00:00"); target.setHours(h);

  if (diff === 1)   return {t:"내일입니다", past:false};
  return {t:`${diff}일 남았습니다`, past:false};
}

            <button class="ghost" type="button" id="copy">주소 복사</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="k">소요 시간</div>
        <div class="v">약 1시간</div>
      </div>
    </div>

    <div class="sec">
      <h2>도착하시면</h2>
      <ol class="steps">
        <li>안내드린 시간 정각에 맞춰 도착해 주세요.</li>
        <li>11층 1101호 앞에서 벨을 눌러주세요.</li>
        <li>앞 시간대 면담이 진행 중이라 일찍 오셔도 정각부터 입장하실 수 있습니다.</li>
      </ol>
      <div class="notes">
        <p>면접 일정은 지원 시 알려주신 가능 일정을 최대한 반영해 배정했습니다. 여러 지원자분의 면접이 연속으로 예정되어 있어 확정된 일정의 변경과 재조율은 어렵습니다.</p>
        <p>부득이하게 참석이 어려워진 경우에만 <a href="${KAKAO}" target="_blank" rel="noopener">카카오톡</a>으로 미리 연락해 주세요.</p>
      </div>
    </div>
  </div>`;
}

function missHTML(q){
  return `
  <div class="miss reveal">
    <h2>“${esc(q)}” 님의 일정을 찾지 못했습니다</h2>
    <p>이름의 띄어쓰기나 오타를 확인해 주세요. 서류 합격 안내를 받으셨는데도 조회되지 않는다면, 아래쪽 카카오톡 문의 버튼으로 연락 주시면 확인해 드리겠습니다.</p>
    <a class="ghost" href="${KAKAO}" target="_blank" rel="noopener">카카오톡으로 문의하기</a>
  </div>`;
}

function pickHTML(list){
  return `
  <div class="miss reveal">
    <h2>해당하는 분이 여러 명입니다</h2>
    <p>본인에 해당하는 항목을 선택해 주세요.</p>
    <div class="pick">
      ${list.map((p,i)=>`<button type="button" data-i="${i}">${esc(p.name)} <span>${esc(p.alias)}</span></button>`).join("")}
    </div>
  </div>`;
}

let candidates = [];
function render(html){ $("#result").innerHTML = html; bind(); }

function bind(){
  const copy = $("#copy");
  if (copy) copy.addEventListener("click", async () => {
    const text = ADDRESS + " " + PLACE;
    try { await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    const t = $("#toast"); t.classList.add("on");
    setTimeout(()=>t.classList.remove("on"), 1600);
  });
  document.querySelectorAll(".pick button").forEach(b=>{
    b.addEventListener("click", ()=> render(cardHTML(candidates[+b.dataset.i])));
  });
}

function keysOf(p){
  const k = new Set();
  const add = v => { const n = norm(v); if (n) k.add(n); };
  add(p.name);
  add(p.alias);
  add(p.alias.replace(/프레스런/g, ""));
  p.alias.split(/\s+/).forEach(add);
  return [...k];
}

function search(){
  const raw = $("#q").value.trim();
  const q = norm(raw);
  if (!q){ $("#result").innerHTML = ""; $("#q").focus(); return; }

  const rows = DATA.map(p => ({p, keys: keysOf(p)}));
  let hits = rows.filter(r => r.keys.some(k => k === q));
  if (!hits.length) hits = rows.filter(r => r.keys.some(k => k.startsWith(q)));
  if (!hits.length) hits = rows.filter(r => r.keys.some(k => k.includes(q)));
  hits = hits.map(r => r.p);

  if (hits.length === 1) render(cardHTML(hits[0]));
  else if (hits.length > 1){ candidates = hits; render(pickHTML(hits)); }
  else render(missHTML(raw));
}

$("#go").addEventListener("click", search);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
